name: Tests ETL

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Correr tests
        run: pytest tests/ -v
