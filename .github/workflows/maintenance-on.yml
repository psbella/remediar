# .github/workflows/maintenance-on.yml
name: 🔴 Activar mantenimiento

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-main-write
  cancel-in-progress: false

jobs:
  maintenance-on:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Backup y reemplazar index
        run: |
          if [ -f index.html.bak ]; then
            echo "Ya existe index.html.bak: el sitio ya esta en mantenimiento. Abortando para no pisar el backup."
            exit 1
          fi
          cp index.html index.html.bak
          cp mantenimiento.html index.html

      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html index.html.bak
          git commit -m "chore: activate maintenance page"
          git push
